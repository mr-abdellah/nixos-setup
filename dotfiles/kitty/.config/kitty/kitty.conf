# Try these font sizes to find what works:
font_size 16

# Enable DPI awareness for better scaling
dpi_aware yes

# Adjust line height if text appears cramped
adjust_line_height 110%

window_padding_width 10 10
copy_on_select yes

shell_integration enabled no-cursor no-sudo

# Cursor settings
cursor_shape block
cursor_blink_interval 0.5

confirm_os_window_close 0

enable_audio_bell no

# Zoom shortcuts
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

enabled_layouts splits:split_axis=horizontal,stack
map ctrl+shift+m toggle_layout stack
map kitty_mod+h launch --location=hsplit --cwd current
map kitty_mod+enter launch --location=vsplit --cwd current

map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

# map kitty_mod+h move_window left
# map kitty_mod+j move_window bottom
# map kitty_mod+k move_window top
# map kitty_mod+l move_window right
map alt+e pipe @screen_scrollback overlay nvim - -c 'set filetype=scrollback' -c 'source ~/.config/nvim/ftplugin/scrollback.vim'

allow_remote_control yes
listen_on unix:/tmp/kitty

# can be: hidden, fade
tab_bar_style separator 

tab_separator " | "
active_tab_font_style bold
inactive_tab_font_style normal


# BEGIN_KITTY_FONTS
font_family      family="Geist Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Alabaster
include current-theme.conf
# END_KITTY_THEME

# map kitty_mod+r load_config_file

