# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = Monospace

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 0, 1, linear
    animation = inputFieldWidth, 1, 3, easeOut
    animation = inputFieldFade, 0, 1, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 5
}

input-field {
    monitor =
    size = 200, 24
    outline_thickness = 0
    dots_size = 0.5
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    dots_text_format = *
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(255, 255, 255)
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    fail_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_text =
    clear_on_fail = true
    fail_transition = 0
    capslock_color = rgba(0, 0, 0, 0)
    position = 0, 0
    halign = center
    valign = center
    rounding = 0
}

# fail / cooldown message
label {
    monitor =
    text = $FAIL
    color = rgba(220, 80, 80, 0.9)
    font_size = 13
    font_family = $font
    position = 0, -56
    halign = center
    valign = center
}

# attempt counter (shows when > 0)
label {
    monitor =
    text = cmd[update:500] echo "$ATTEMPTS attempts"
    color = rgba(255, 255, 255, 0.4)
    font_size = 11
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}
