# Hyprland configuration file
# Converted from i3 config by Hachem Betrouni

# ── General ────────────────────────────────────────────────
# Set mod key (Mod4 = Super/Windows key)
$mod = SUPER

monitor = eDP-1, 2880x1800@90, auto, 1
monitor = DP-2, 1920x1080@60, auto, 0.8

monitor = HDMI-A-1, 1920x1080@60, auto, 0.8
# or flip screen horizontally 
# monitor = HDMI-A-1, 1920x1080@60, auto, 1, transform, 1

# Borders and gaps
general {
    border_size = 1
    gaps_in = 2
    gaps_out = 0
}

xwayland {
    enabled = true
    force_zero_scaling = true
}

misc {
    disable_splash_rendering = true
    disable_hyprland_logo = true
    background_color = 000000
}

decoration {
    rounding = 10
    dim_special = 0
}

# Focus follows mouse
input {
    follow_mouse = 1
    kb_layout = us,ara
    kb_options = grp:win_space_toggle
    repeat_delay = 200
    repeat_rate = 100
}


animations {
    enabled = no
    bezier = linear, 0, 0, 1, 1
    animation = windows, 1, 1, linear
    animation = fade, 1, 1, linear
    animation = workspaces, 1, 1, linear
    animation = specialWorkspace, 0
}

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16
env = HYPRSHOT_DIR,/home/hachem/screenshots/

# ── Autostart Apps ─────────────────────────────────────────
exec-once = wl-paste --watch cliphist store
exec-once = udiskie
exec-once = conky -c $HOME/.config/conky/left.conf
exec-once = conky -c $HOME/.config/conky/right.conf
exec-once = conky -c $HOME/.config/conky/center.conf
exec-once = conky -c $HOME/.config/conky/bottom.conf
exec-once = dunst
exec-once = wlsunset -l 36.7538 -L 3.0588 #Algiers
# exec-once = wlsunset -l 37.7739 -L -122.4312 #SF

# ── Window Rules ───────────────────────────────────────────
# Example of how to make float windows
# Float Obsidian, center, size, scratchpad
# windowrule = float, class:obsidian
# windowrule = center, class:obsidian
# windowrule = size 1200 800, class:obsidian
# windowrule = noinitialfocus, class:obsidian
# windowrule = workspace special:scratchpad, class:obsidian

# Conky
windowrule = float, nofocus, class:Conky

# Todo browser
windowrule = float, class:todo-browser
windowrule = size 400 520, class:todo-browser
windowrule = center, class:todo-browser

# ── Keybinds ───────────────────────────────────────────────
# Terminal / Apps
bind = $mod, T, exec, kitty
bind = $mod, E, exec, kitty -e yazi
bind = $mod SHIFT, E, exec, nautilus
bind = $mod, I, exec, kitty -e iwctl
bind = $mod, D, exec, rofi -combi-modi window,run -modi combi -show combi
bind = $mod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mod, B, exec, brave
bind = $mod, S, exec, WINEPREFIX=$HOME/.wine64 WINEARCH=win64 wine $HOME/strawberry/Strawberry.exe --no-sandbox

# Screenshots
bind = $mod SHIFT, S, exec, hyprshot -m region --clipboard-only

# Todo browser
bind = $mod, N, exec, brave --app=file://$HOME/.config/eww/todo-browser.html --class=todo-browser

# Kill focused window
bind = $mod, Q, killactive

# Fullscreen toggle
bind = $mod, M, fullscreen

# Floating toggle
bind = $mod, Y, togglefloating

# Move floating windows with Super + Left Mouse
bindm = SUPER, mouse:272, movewindow
# Resize floating windows with Super + Right Mouse
bindm = SUPER, mouse:273, resizewindow

# Vim-style window resizing
bind = CTRL SUPER, h, resizeactive, -40 0   # shrink width
bind = CTRL SUPER, l, resizeactive,  40 0   # grow width
bind = CTRL SUPER, k, resizeactive,  0 -40  # shrink height
bind = CTRL SUPER, j, resizeactive,  0  40  # grow height

# Navigation (vim-style and arrows)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# Workspaces (1–10)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Resize (Hyprland doesn’t have “resize mode”, just binds)
bind = $mod ALT, H, resizeactive, -20 0
bind = $mod ALT, L, resizeactive, 20 0
bind = $mod ALT, J, resizeactive, 0 20
bind = $mod ALT, K, resizeactive, 0 -20

# Multimedia keys
# --- Volume Controls ---
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = $mod, F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mod, F3, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = $mod, F4, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Microphone ---
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle 

# --- Brightness Controls ---
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5% 
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- 


# ------ Gestures _________
gesture = 3, horizontal, workspace
gesture = 3, vertical, special, scratchpad
