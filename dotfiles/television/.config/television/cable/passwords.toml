[metadata]
name = "passwords"
description = "A channel to find and manage passwords"
requirements = ["pass", "sed", 'wl-copy']

[source]
command = "find ~/.password-store -name '*.gpg' | sed 's|.*/.password-store/||;s|\\.gpg$||'"

[keybindings]
enter = "actions:copy"

[actions.copy]
description = "Copy the selected password"
command = "pass '{}' -c && kill $PPID"
mode = "execute"
